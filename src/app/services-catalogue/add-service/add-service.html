<form [formGroup]="serviceForm" (ngSubmit)="save()">
  <label>Libellé</label>
  <input type="text" formControlName="libelle" class="form-control" />
  @if (serviceForm.get('libelle')?.invalid && serviceForm.get('libelle')?.touched) {
    <span class="erreur">Libellé requis</span>
  }

  <label>Prix unitaire (FCFA)</label>
  <input type="number" formControlName="prix_unitaire" class="form-control" />
  @if (serviceForm.get('prix_unitaire')?.invalid && serviceForm.get('prix_unitaire')?.touched) {
    <span class="erreur">Prix valide requis</span>
  }

  <label>Description</label>
  <textarea formControlName="description" class="form-control"></textarea>

  <label class="checkbox-label">
    <input type="checkbox" formControlName="disponible" />
    Disponible au catalogue
  </label>

  @if (erreur()) {
    <p class="erreur-globale">{{ erreur() }}</p>
  }

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="annule.emit()">Annuler</button>
    <button type="submit" class="btn-primary" [disabled]="serviceForm.invalid || enCours()">
      {{ enCours() ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </div>
</form>

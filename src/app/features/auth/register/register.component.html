<div class="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-950 relative overflow-hidden p-4 transition-colors">
      <div class="absolute inset-0 bg-gradient-to-br from-primary-700 via-slate-900 to-slate-950"></div>
      <div class="absolute -top-32 -right-32 h-96 w-96 rounded-full bg-primary-500/30 blur-3xl"></div>
      <div class="absolute -bottom-32 -left-32 h-96 w-96 rounded-full bg-purple-500/20 blur-3xl"></div>

      <div class="absolute top-4 right-4 z-10">
        <div class="rounded-lg bg-white/10 backdrop-blur">
          <app-theme-toggle></app-theme-toggle>
        </div>
      </div>

      <div class="relative z-10 w-full max-w-sm">
        <div class="flex flex-col items-center mb-8">
          <div class="h-14 w-14 rounded-2xl bg-white/10 backdrop-blur flex items-center justify-center ring-1 ring-white/20 mb-3">
            <lucide-icon name="graduation-cap" [size]="28" class="text-white"></lucide-icon>
          </div>
          <span class="text-2xl font-bold text-white">Sunu<span class="text-primary-400">Xam</span></span>
        </div>

        <div class="rounded-2xl bg-white dark:bg-slate-800 p-8 shadow-2xl">
          <h1 class="text-xl font-bold text-slate-900 dark:text-white">Créer un compte</h1>
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Rejoignez SunuXam en quelques secondes.</p>

          <form (ngSubmit)="onSubmit()" class="mt-6 space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="label-field">Prénom</label>
                <input class="input-field" type="text" [(ngModel)]="form.prenom" name="prenom" required />
              </div>
              <div>
                <label class="label-field">Nom</label>
                <input class="input-field" type="text" [(ngModel)]="form.nom" name="nom" required />
              </div>
            </div>
            <div>
              <label class="label-field">Nom d'utilisateur</label>
              <div class="relative">
                <lucide-icon name="circle-user-round" [size]="18" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></lucide-icon>
                <input class="input-field pl-10" type="text" [(ngModel)]="form.username" name="username" required />
              </div>
            </div>
            <div>
              <label class="label-field">Téléphone</label>
              <div class="relative">
                <lucide-icon name="phone" [size]="18" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></lucide-icon>
                <input class="input-field pl-10" type="tel" [(ngModel)]="form.telephone" name="telephone" placeholder="77 000 00 00" />
              </div>
            </div>
            <div>
              <label class="label-field">Mot de passe</label>
              <div class="relative">
                <lucide-icon name="key-round" [size]="18" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></lucide-icon>
                <input class="input-field pl-10" type="password" [(ngModel)]="form.password" name="password" required minlength="6" />
              </div>
            </div>

            <button type="submit" class="btn-primary w-full mt-2" [disabled]="loading()">
              @if (loading()) { <app-spinner [size]="16" class="text-white"></app-spinner> }
              Créer mon compte
            </button>
          </form>

          <p class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
            Déjà inscrit ?
            <a routerLink="/connexion" class="font-semibold text-primary-600 dark:text-primary-400 hover:text-primary-700">Se connecter</a>
          </p>
        </div>
      </div>
    </div>
